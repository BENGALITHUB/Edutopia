name: CI Quality Gate

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  workflow_dispatch:

jobs:
  verify:
    name: Typecheck & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'tutopia/client/package.json'

      - name: Install Client Dependencies
        run: |
          cd tutopia/client
          npm ci || npm install

      - name: Run TypeScript Typecheck
        run: |
          cd tutopia/client
          npm run typecheck

      - name: Run Production Build
        run: |
          cd tutopia/client
          npm run build

      - name: Verify Distribution Artifacts
        run: |
          test -f tutopia/client/dist/index.html || { echo "Build output dist/index.html not found!"; exit 1; }
          echo "Production build verified successfully."
