name: CI Quality Gate

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  workflow_dispatch:

jobs:
  verify:
    name: Typecheck & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          if [ -d "tutopia/client" ]; then cd tutopia/client; fi
          npm ci || npm install

      - name: Run TypeScript Typecheck
        run: |
          if [ -d "tutopia/client" ]; then cd tutopia/client; fi
          npm run typecheck

      - name: Run Production Build
        run: |
          if [ -d "tutopia/client" ]; then cd tutopia/client; fi
          npm run build

      - name: Verify Distribution Artifacts
        run: |
          if [ -d "tutopia/client/dist" ]; then
            test -f tutopia/client/dist/index.html || { echo "Build output not found!"; exit 1; }
          else
            test -f dist/index.html || { echo "Build output not found!"; exit 1; }
          fi
          echo "Production build verified successfully."
