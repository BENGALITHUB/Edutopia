name: Deploy to AWS (S3 + CloudFront)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  deploy:
    name: Build & Sync to AWS S3 / CloudFront
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          if [ -d "tutopia/client" ]; then cd tutopia/client; fi
          npm ci || npm install

      - name: Build Production Bundle
        run: |
          if [ -d "tutopia/client" ]; then cd tutopia/client; fi
          npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-south-1' }}

      - name: Sync Static Assets to S3 Bucket
        run: |
          DIST_DIR=$([ -d "tutopia/client/dist" ] && echo "tutopia/client/dist" || echo "dist")
          # Sync HTML with no-cache so users always receive latest revision
          aws s3 sync $DIST_DIR s3://${{ secrets.AWS_S3_BUCKET }} \
            --delete \
            --exclude "assets/*" \
            --cache-control "public, max-age=0, must-revalidate"

          # Sync hashed assets with 1-year immutable caching
          aws s3 sync $DIST_DIR/assets s3://${{ secrets.AWS_S3_BUCKET }}/assets \
            --cache-control "public, max-age=31536000, immutable"

      - name: Invalidate CloudFront CDN Cache
        if: ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
